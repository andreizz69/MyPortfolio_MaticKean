    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        #header {
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url(pictures/p6.jpg);
            background-size: cover;
            background-position: center;
        }

        .container {

        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        nav ul li {
            display: inline-block;
            list-style: none;
            margin: 10px 20px;
        }   

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            position: relative;
            text-shadow: 1px 1px 1px lightgray;
        }
        nav ul li ::after {
            content: '';
            width: 0;
            height: 4px;
            background: #51e2f5;
            position: absolute;
            left: 0;
            bottom: -6px;
            transition: 1s;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        nav a {
            text-decoration: none;
            font-size: 30px;
            padding-top: 15px;
            color: #51e2f5;
        }

        .header-text {
            margin-top: 15%;
